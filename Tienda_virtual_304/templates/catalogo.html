<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Ngu'i Mazahua</title>
</head>
<body style="background-color: #e59866; font-family: sans-serif; padding: 20px;">
    <h1>Catálogo de ropa Mujeres</h1>
    <table border="1" style="background: white; width: 100%; border-collapse: collapse; text-align: left;">
        <tr>
            <th>Producto</th>
            <th>Precio</th>
        </tr>
        {% for prod in productos %}
        <tr>
            <td style="padding: 10px;">{{ prod.nombre }}</td>
            <td style="padding: 10px;">${{ prod.precio }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/ventas" style="color: white; font-weight: bold;">Ir al Registro de Ventas</a>
</body>
</html>
