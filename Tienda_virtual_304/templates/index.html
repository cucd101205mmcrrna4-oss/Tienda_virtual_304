<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Virtual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5e6d3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 15px #999;
        }
        h1 {
            color: #8b4513;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #8b4513;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #63300e;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="login">
        <h1>Tienda Virtual</h1>
        <h3>Iniciar sesión</h3>
        <form method="POST" action="/">
            <input type="text" name="usuario"
                   placeholder="Usuario" required>
            <input type="password" name="contrasena"
                   placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
